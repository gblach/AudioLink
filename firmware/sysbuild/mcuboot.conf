CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=y

# USB recovery mode, entered when the application sets the boot mode or has no valid image
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_USB_DEVICE_MANUFACTURER="Magik"
CONFIG_USB_DEVICE_PRODUCT="AudioLink bootloader"
# The application uses 0x2fe3:0xa0d1, a different PID lets the host tell the two apart
CONFIG_USB_DEVICE_VID=0x2fe3
CONFIG_USB_DEVICE_PID=0xa0d2
# Image 3 is the network core, see nrf53_hooks.c in NCS
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_UART_CONSOLE=n

# Refuse to install an image with a lower version than the running one, so a
# paired phone cannot put an older signed release back. USB recovery mode
# writes the slots directly and is not checked.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
